<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacte - 2xKO</title>
    <meta name="author" content="Iker Cárdenas">
    <meta name="description" content="Formulari de contacte de 2xKO">
    <link rel="icon" type="image/x-icon" href="./img/favicon.ico">
    <link rel="stylesheet" href="./css/styleindexicontacte.css">
</head>

<body>
    <div class="container">
        <header>
            <div class="header-content">
                <img src="./img/2xko.png" alt="Logo 2xKO" class="header-image">
                <h1>Contacte</h1>
            </div>
            <nav class="navbar">
                <a href="./index.html">Inicio</a>
                <a href="./login.html">Login</a>
                <a href="./about.html">About</a>
                <a href="./contacto.html">Contacto</a>
            </nav>
        </header>

        <main class="content-wrapper content-centered">
            <article class="card form-card">
                <h2>Formulari de Contacte</h2>
                <p class="form-subtitle">Posa't en contacte amb nosaltres mitjançant el següent formulari.</p>

                <form action="" method="POST" class="form-grid">
                    <div class="form-group">
                        <label for="user">Usuari</label>
                        <input id="user" type="text" placeholder="Introdueix el teu usuari" name="uname" required>
                    </div>

                    <div class="form-group">
                        <label for="correo">Correu Electrònic</label>
                        <input type="email" id="correo" placeholder="Introdueix el teu correu" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="descripcion">Motiu de la consulta</label>
                        <textarea id="descripcion" placeholder="Descriu per què vols contactar amb nosaltres" name="description" rows="4" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-full">Enviar</button>
                </form>
            </article>
        </main>

        <footer>
            <p class="texto_footer">© 2026 Arnau Milrado, Iker Cárdenas i Marc Llandres.</p>
        </footer>
    </div>
</body>

</html>
